name: Verify and build Windows preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npm run verify
        env:
          JARVIS_PYTHON: python
      - run: npm run package:win
      - name: Package private Ultron plugin
        run: python scripts/package-plugin.py
      - name: Open packaged Electron main, preload and renderer
        run: node scripts/native-smoke.mjs --packaged
      - name: Calculate SHA256
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*.exe' | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GleysonSilva-Jarvis-Windows-preview
          path: |
            release/*.exe
            release/*-Windows.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Ultron-Plugin-preview
          path: |
            release/Jarvis-Ultron-*.zip
            release/Jarvis-Ultron-*.zip.sha256
          if-no-files-found: error
